# piezas.conf - la UNICA lista de piezas y la UNICA fuente de la linea de configure de FFmpeg
# (FFMPEG-PROPIO.md, 3). De aqui salen:
#   - la linea de configure de cada sistema (tools/piezas.sh args <sistema>);
#   - expected/buildconf-*.txt (tools/piezas.sh buildconf <sistema>; «piezas.sh comprobar» exige que
#     los archivos versionados coincidan con lo que genera este);
#   - las listas de lo permitido y lo prohibido que miden las puertas (tools/puertas.mjs, ff-checklist).
#
# Formato:
#   - secciones [nombre]; lineas vacias y las que empiezan por # no cuentan;
#   - en las secciones configure-*: UNA opcion por linea, SIN comillas de shell. El valor puede llevar
#     espacios (--extra-cflags=...): cada linea es un unico argumento de configure;
#   - orden de la linea final: configure-entorno-<sistema>, configure-comun, configure-<familia>,
#     configure-<sistema> (si existe). --disable-encoders va antes de cualquier --enable-encoder.
#
# Sistemas: win (x86_64, compilacion cruzada con el fork de BtbN), mac-arm64 y mac-x86_64 (compilacion
# nativa en cada runner; el asset del Mac es el binario universal que une los dos).

[global]
macos-min=13.0
nvenc-min-driver=531.61
nvenc-cabeceras=n12.1.14.0

# ---------------------------------------------------------------------------------------- 3.1 Incluir
# pieza  sistemas. tools/lock.sh comprobar exige que las filas rol:fuente y rol:toolchain del lock
# sean exactamente estas, y aplicar-lock.sh que cada script de win/scripts.d sea de una de ellas.
[piezas]
ffmpeg win,mac
x264 win,mac
x265 win,mac
libvpx win,mac
dav1d win,mac
svtav1 win,mac
snappy win,mac
zimg win,mac
libxml2 win,mac
opus win,mac
lame win,mac
xz win,mac
zlib win
bzip2 win
libiconv win
ffnvcodec win
amf win
libvpl win
mingw-std-threads win
mingw-w64 win
crosstool-ng win
gcc win
binutils win
mingw-w64-ctng win
gmp win
mpfr win
mpc win
isl win
zlib-ctng win
zstd-ctng win
gettext-ctng win
mold-ctng win

# ------------------------------------------------------------------------ 3.6 Lineas de configure
[configure-entorno-win]
--prefix=/ffbuild/prefix
--pkg-config=pkg-config
--cross-prefix=x86_64-w64-mingw32-
--arch=x86_64
--target-os=mingw32
--cc=x86_64-w64-mingw32-gcc
--cxx=x86_64-w64-mingw32-g++
--ar=x86_64-w64-mingw32-gcc-ar
--ranlib=x86_64-w64-mingw32-gcc-ranlib
--nm=x86_64-w64-mingw32-gcc-nm

[configure-entorno-mac-arm64]
--prefix=/tmp/vf/instalado
--pkg-config=pkg-config
--cc=clang
--cxx=clang++
--arch=arm64

[configure-entorno-mac-x86_64]
--prefix=/tmp/vf/instalado
--pkg-config=pkg-config
--cc=clang
--cxx=clang++
--arch=x86_64

[configure-comun]
--extra-version=veation.1
--enable-gpl
--enable-version3
--disable-autodetect
--disable-shared
--enable-static
--pkg-config-flags=--static
--disable-doc
--disable-ffplay
--enable-ffprobe
--disable-network
--disable-indevs
--enable-indev=lavfi
--disable-outdevs
--enable-zlib
--enable-bzlib
--enable-lzma
--enable-iconv
--enable-libxml2
--enable-libsnappy
--enable-libzimg
--enable-libx264
--enable-libx265
--enable-libvpx
--enable-libdav1d
--enable-libsvtav1
--enable-libopus
--enable-libmp3lame
--disable-encoders
--enable-encoder=libx264,libx265,libsvtav1,libvpx_vp9,hap,dnxhd,png,apng,tiff,exr,dpx,mjpeg,flac,libopus,libmp3lame,pcm_*,rawvideo,wrapped_avframe,vnull,anull
--disable-decoder=vvc,vvc_qsv

[configure-win]
--disable-w32threads
--enable-pthreads
--enable-ffnvcodec
--enable-cuda
--enable-cuvid
--enable-nvdec
--enable-nvenc
--enable-amf
--enable-libvpl
--enable-d3d11va
--enable-d3d12va
--enable-dxva2
--enable-mediafoundation
--enable-encoder=h264_nvenc,hevc_nvenc,av1_nvenc,h264_amf,hevc_amf,av1_amf,h264_qsv,hevc_qsv,av1_qsv,h264_mf,hevc_mf,aac_mf

[configure-mac]
--enable-videotoolbox
--enable-audiotoolbox
--enable-encoder=h264_videotoolbox,hevc_videotoolbox,prores_videotoolbox,aac_at
--extra-cflags=-mmacosx-version-min=13.0 -I/tmp/vf/prefix/include
--extra-ldflags=-mmacosx-version-min=13.0 -L/tmp/vf/prefix/lib -L/tmp/vf/shim

[configure-mac-arm64]
--enable-neon

[configure-mac-x86_64]

# ------------------------------------------------------------- 3.4 y 5.6: lo que NO puede estar
# Nombres tal como los imprime «ffmpeg -encoders/-decoders/-protocols»; las puertas comparan
# cambiando «-» por «_», asi que libaom-av1 y libaom_av1 son el mismo.
[codificadores-prohibidos]
prores prores_aw prores_ks prores_ks_vulkan
aac
ac3 ac3_fixed eac3 ac3_mf truehd mlp dca
mpeg4 msmpeg4 msmpeg4v2 msmpeg4v3 dxv libx264rgb
libvvenc libxeve libxvid libopencore_amrnb libvo_amrwbenc libaom_av1 librav1e libsvtjpegxs liboapv libfdk_aac

[decodificadores-prohibidos]
vvc vvc_qsv

[protocolos-prohibidos]
http https tcp udp rtmp rtp srt tls ftp

# A3: cadenas que no pueden aparecer en -buildconf.
[buildconf-prohibido]
nonfree libfdk libmpeghdec libnpp cuda-nvcc cuda-sdk cuda-llvm decklink opencore vvenc xeve xevd xvid
svtjpegxs oapv frei0r avisynth ladspa rubberband vidstab davs2 xavs2 uavs3d whisper
dvdcss dvdread dvdnav lcevc vulkan opencl libplacebo shaderc

# A4: opciones que tienen que estar en -buildconf.
[buildconf-obligatorio]
--enable-gpl --enable-version3 --disable-autodetect --disable-network --disable-encoders

[hwaccels-win]
cuda d3d11va dxva2 d3d12va qsv

[hwaccels-mac]
videotoolbox

# ------------------------------------------------------------------- enlazado real (tools/enlazado.mjs)
# Cada biblioteca estatica que el enlazador abre desde el prefijo de dependencias tiene que ser de una
# pieza del lock. Lo que abre del toolchain o del SDK cuenta como runtime admitido; cualquier otra
# ruta (Homebrew, /usr/local, una biblioteca sin fila) pone la puerta en rojo.
[enlazado]
libx264.a x264
libx265.a x265
libvpx.a libvpx
libdav1d.a dav1d
libSvtAv1Enc.a svtav1
libsnappy.a snappy
libzimg.a zimg
libxml2.a libxml2
libopus.a opus
libmp3lame.a lame
liblzma.a xz
libz.a zlib
libbz2.a bzip2
libiconv.a libiconv
libcharset.a libiconv
libvpl.a libvpl

[enlazado-rutas-win]
prefijo /opt/ffbuild/lib/
runtime /opt/ct-ng/
compilacion /ffbuild/ffmpeg/

[enlazado-rutas-mac]
prefijo /tmp/vf/prefix/lib/
runtime /Applications/Xcode_16.4.app/
runtime /Library/Developer/CommandLineTools/
shim /tmp/vf/shim/
compilacion /tmp/vf/ffmpeg/
