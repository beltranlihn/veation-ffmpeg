# versions.lock - UNICA fuente de versiones de veation-ffmpeg (FFMPEG-PROPIO.md, 2.3).
#
# La leen con awk tools/lock.sh (y a traves de el aplicar-lock.sh, fetch.sh, congelar.sh y los
# scripts de mac/). Una fila por pieza; columnas separadas por espacios:
#
#   pieza  sistemas  tipo  origen  ref  [clave:valor ...]
#
# sistemas  win | mac | win,mac | ninguno
# tipo      git          repositorio; la identidad es el COMMIT (commit:<40 hex>)
#           tarball      archivo publicado por el proyecto; la identidad es el SHA-256 (sha256:<64 hex>)
#           oci          imagen de contenedor; la identidad es el digest (digest:sha256:<64 hex>)
#           herramienta  archivo de una herramienta que se usa SIN modificar (sha256:<64 hex>)
#           referencia   dato fijo que no se descarga (version de Xcode, de Electron)
# claves    rol:fuente      enlazada en el binario; va al paquete de fuente
#           rol:toolchain   compila el binario y aporta el runtime enlazado; va al paquete de fuente
#           rol:herramienta se usa sin modificar; NO va al paquete (GPLv3 1, «System Libraries» / herramientas)
#           rol:prueba      solo para las pruebas de la CI; nunca se distribuye
#           rol:receta      el fork de BtbN (win/); va al paquete como parte de la receta
#           commit: sha256: digest:   identidad; PENDIENTE hasta que tools/congelar.sh la calcule
#           gpg:<huella> firma:<url>  firma OpenPGP que congelar.sh y fetch.sh verifican
#           clave:<url>               de donde sacar la clave si no esta en los servidores (vale solo
#                                     si su huella es exactamente la de gpg:)
#           etiqueta:<tag>            etiqueta git que corresponde al tarball (se comprueba con commit:)
#           resolver:rev-count        ref = r<N>: el commit N-esimo de la rama principal (x264)
#           solo:<ruta>[,<ruta>]      se archiva solo esa parte del arbol (cabeceras que se compilan)
#           contenido:<ruta>=<sha256> archivo concreto dentro del tarball (juez de las pruebas)
#           opcional:si               puede seguir PENDIENTE; la puerta que lo usa sale «NO MEDIDA»
#           chromium:<version>        version de Chromium que corresponde a la de Electron
#
# PENDIENTE: valor que todavia no se ha calculado. tools/lock.sh comprobar falla mientras quede
# alguno (salvo opcional:si) y build.yml no arranca. Se resuelven con el workflow «congelar»
# (o tools/congelar.sh en local) y el resultado se revisa y se versiona a mano.
#
# Regla de versiones del primer cambio (FFMPEG-PROPIO.md, 1.5): la etiqueta igual a la del binario
# de gyan o, si no la hay, la anterior mas cercana; zlib, bzip2, xz, libiconv, libxml2 y zimg, la
# ultima estable (xz nunca 5.6.0 ni 5.6.1). Las subidas de version van en rondas aparte.

